modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/pavlojs/raven-economy/issues"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version},1.22)"
ordering = "NONE"
side = "BOTH"

# Ranks are bought through the LuckPerms API when it is present. Without it the
# economy still runs; only the rank tab in the ATM goes away.
[[dependencies.${mod_id}]]
modId = "luckperms"
type = "optional"
versionRange = "[5,)"
ordering = "AFTER"
side = "SERVER"
