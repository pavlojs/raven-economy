name: Build

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin

      # No wrapper is committed yet: it has to be generated by a Gradle that
      # can run, and this repo was scaffolded on a machine with neither Gradle
      # nor a JDK 21. Run `gradle wrapper` once locally and this step becomes
      # `./gradlew build`.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"

      - name: Build
        run: gradle build --no-daemon

      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: ravencoin-jar
          path: build/libs/*.jar
          if-no-files-found: error
