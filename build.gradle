plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'net.ltgt.errorprone' version '5.1.1'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
}

// The Minecraft line belongs in the file name, not only in the metadata. One
// day this mod will exist for two of them at once, and `ravencoin-0.2.0.jar`
// would then be two different files with one name — in a downloads folder, in
// a pack's cache, in a bug report. `ravencoin-1.21.1-0.2.0.jar` cannot be.
base {
    archivesName = "${mod_id}-${minecraft_version}"
}

// Minecraft 1.21.1 runs on Java 21. Pinning the toolchain rather than
// inheriting the machine's JDK keeps a local build and CI producing the same
// bytecode.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = '2024.11.17'
        minecraftVersion = '1.21.1'
    }

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            clientData()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // LuckPerms' API only — the mod itself is a runtime dependency of the pack,
    // never something we ship. Rank purchases go through this rather than by
    // running `lp` as a console command, so a failure is an exception we can
    // catch instead of a silently swallowed chat message.
    compileOnly 'net.luckperms:api:5.5'

    errorprone 'com.google.errorprone:error_prone_core:2.50.0'
    errorprone 'com.uber.nullaway:nullaway:0.14.3'
}

/**
 * The languages the jar carries, each with every key (checkTranslations fails
 * the build otherwise). Another file in the lang folder can be a translation
 * still in progress: it stays out of the jar until its code is added here.
 */
def shippedLanguages = ['en_us', 'pl_pl']

// Expand gradle.properties into neoforge.mods.toml so the version lives in one
// place. Everything else in that file is written by hand.
tasks.named('processResources', ProcessResources).configure {
    var replacements = [
        minecraft_version    : minecraft_version,
        neo_version_range    : neo_version_range,
        loader_version_range : loader_version_range,
        mod_id               : mod_id,
        mod_name             : mod_name,
        mod_license          : mod_license,
        mod_version          : mod_version,
        mod_authors          : mod_authors,
        mod_description      : mod_description,
    ]
    inputs.properties replacements
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replacements
    }

    // A language that is not shipped stays out of the jar.
    inputs.property 'shippedLanguages', shippedLanguages
    exclude { element ->
        element.path.startsWith('assets/ravencoin/lang/') &&
            !shippedLanguages.contains(element.name - '.json')
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21

    // Error Prone is the code gate. A warning nobody has to act on is not a gate,
    // so every finding fails the build and has to be either fixed or refused in
    // writing at the line that causes it.
    //
    // -Werror is safe to reach for here only because javac's own lint stays at
    // its defaults: Error Prone's findings are the only warnings this build
    // emits, and the deprecation chatter that comes with compiling against
    // Minecraft arrives as a Note, which -Werror does not touch.
    //
    // The first run of this paid for itself. It found a shop's stock side being
    // written to NBT by Enum.ordinal() and read back with values()[…], which
    // fails a whole chunk on one corrupt byte; and a rank refund that reached
    // through a ServerPlayer on LuckPerms' thread, where a player who had logged
    // out in the meantime turned the refund into a swallowed NPE.
    options.compilerArgs << '-Werror'

    // NullAway turns the nullability this code already describes in prose into
    // something the compiler checks. Scoped to our own package: Minecraft is
    // unannotated and treated as non-null, which is the only setting that does
    // not drown the build in findings about somebody else's API.
    options.errorprone {
        error('NullAway')
        option('NullAway:AnnotatedPackages', 'net.whiteravens.ravencoin')
        // A Screen's widget fields are assigned in init(), which Minecraft calls
        // rather than the constructor. Without this, every screen looks like it
        // leaves its own fields unset.
        option('NullAway:KnownInitializers', 'net.minecraft.client.gui.screens.Screen.init')
    }
}

java {
    withSourcesJar()
}

/**
 * Every shipped language must carry every key, and no language file may have an
 * empty value or other arguments than English.
 *
 * Not a style rule. The mod this one replaces shipped a Polish translation with
 * five empty strings, and one of them was the reply to `/money` — so a Polish
 * player asking their balance got a blank line and no way to tell whether the
 * command had worked. A missing key at least falls back to English and is
 * merely untranslated; an empty one is invisible breakage. This catches both,
 * and it runs in CI so it catches them before a player does. A file that is not
 * shipped can be a translation still in progress: it may lack keys, and what it
 * has is checked like the rest.
 */
tasks.register('checkTranslations') {
    def langDir = file('src/main/resources/assets/ravencoin/lang')
    def shipped = shippedLanguages
    inputs.dir langDir
    inputs.property 'shippedLanguages', shipped
    outputs.upToDateWhen { false }

    doLast {
        def parse = { f ->
            new groovy.json.JsonSlurper().parse(f, 'UTF-8') as Map
        }
        // The arguments a text takes, as Minecraft numbers them: `%s` counts up,
        // `%2$s` names its own, `%%` is a percent sign. A translation may move
        // them around, but a lost or an extra one breaks the line in game.
        def argumentPattern = ~'%(?:(\\d+)\\$)?([A-Za-z%])'
        def arguments = { String text ->
            def found = [] as Set
            int next = 1
            def matcher = argumentPattern.matcher(text)
            while (matcher.find()) {
                if (matcher.group(2) == '%') continue
                found << (matcher.group(1) ? (matcher.group(1) as int) : next++)
            }
            found
        }
        def reference = parse(new File(langDir, 'en_us.json'))
        def problems = []

        shipped.findAll { !new File(langDir, "${it}.json").exists() }.each {
            problems << "${it}.json: shipped, but there is no such file"
        }

        langDir.listFiles({ f -> f.name.endsWith('.json') } as FileFilter).each { f ->
            def entries = parse(f)

            if ((f.name - '.json') in shipped) {
                def missing = reference.keySet() - entries.keySet()
                if (missing) problems << "${f.name}: missing ${missing.sort()}"
            }

            def unknown = entries.keySet() - reference.keySet()
            if (unknown) problems << "${f.name}: not in en_us ${unknown.sort()}"

            def blank = entries.findAll { k, v -> !(v as String)?.trim() }.keySet()
            if (blank) problems << "${f.name}: empty ${blank.sort()}"

            def moved = entries.findAll { k, v ->
                reference.containsKey(k) && arguments(v as String) != arguments(reference[k] as String)
            }.keySet()
            if (moved) problems << "${f.name}: other arguments than en_us ${moved.sort()}"
        }

        if (problems) {
            throw new GradleException("Translation files disagree:\n  " + problems.join('\n  '))
        }
        logger.lifecycle("translations: ${shipped.size()} shipped of ${langDir.listFiles().length} files, ${reference.size()} keys")
    }
}

tasks.named('check') { dependsOn 'checkTranslations' }
