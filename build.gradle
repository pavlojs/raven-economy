plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
}

// The Minecraft line belongs in the file name, not only in the metadata. One
// day this mod will exist for two of them at once, and `ravencoin-0.2.0.jar`
// would then be two different files with one name — in a downloads folder, in
// a pack's cache, in a bug report. `ravencoin-1.21.1-0.2.0.jar` cannot be.
base {
    archivesName = "${mod_id}-${minecraft_version}"
}

// Minecraft 1.21.1 runs on Java 21. Pinning the toolchain rather than
// inheriting the machine's JDK keeps a local build and CI producing the same
// bytecode.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = '2024.11.17'
        minecraftVersion = '1.21.1'
    }

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
        data {
            clientData()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    // LuckPerms' API only — the mod itself is a runtime dependency of the pack,
    // never something we ship. Rank purchases go through this rather than by
    // running `lp` as a console command, so a failure is an exception we can
    // catch instead of a silently swallowed chat message.
    compileOnly 'net.luckperms:api:5.5'
}

// Expand gradle.properties into neoforge.mods.toml so the version lives in one
// place. Everything else in that file is written by hand.
tasks.named('processResources', ProcessResources).configure {
    var replacements = [
        minecraft_version    : minecraft_version,
        neo_version_range    : neo_version_range,
        loader_version_range : loader_version_range,
        mod_id               : mod_id,
        mod_name             : mod_name,
        mod_license          : mod_license,
        mod_version          : mod_version,
        mod_authors          : mod_authors,
        mod_description      : mod_description,
    ]
    inputs.properties replacements
    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replacements
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

java {
    withSourcesJar()
}

/**
 * Every language file must carry every key.
 *
 * Not a style rule. The mod this one replaces shipped a Polish translation with
 * five empty strings, and one of them was the reply to `/money` — so a Polish
 * player asking their balance got a blank line and no way to tell whether the
 * command had worked. A missing key at least falls back to English and is
 * merely untranslated; an empty one is invisible breakage. This catches both,
 * and it runs in CI so it catches them before a player does.
 */
tasks.register('checkTranslations') {
    def langDir = file('src/main/resources/assets/ravencoin/lang')
    inputs.dir langDir
    outputs.upToDateWhen { false }

    doLast {
        def parse = { f ->
            new groovy.json.JsonSlurper().parse(f, 'UTF-8') as Map
        }
        def reference = parse(new File(langDir, 'en_us.json'))
        def problems = []

        langDir.listFiles({ f -> f.name.endsWith('.json') } as FileFilter).each { f ->
            def entries = parse(f)

            def missing = reference.keySet() - entries.keySet()
            if (missing) problems << "${f.name}: missing ${missing.sort()}"

            def unknown = entries.keySet() - reference.keySet()
            if (unknown) problems << "${f.name}: not in en_us ${unknown.sort()}"

            def blank = entries.findAll { k, v -> !(v as String)?.trim() }.keySet()
            if (blank) problems << "${f.name}: empty ${blank.sort()}"
        }

        if (problems) {
            throw new GradleException("Translation files disagree:\n  " + problems.join('\n  '))
        }
        logger.lifecycle("translations: ${langDir.listFiles().length} languages, ${reference.size()} keys, all complete")
    }
}

tasks.named('check') { dependsOn 'checkTranslations' }
